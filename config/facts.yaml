# Facts and hard rules (SPEC.md §7).
#
# REPLACE THESE PLACEHOLDER VALUES with your real details before any live run.
# Rules always take precedence over the LLM; anything not covered by a rule or a
# retrieved resume fact is flagged at review as NEEDS_REVIEW rather than guessed.

facts:
  work_authorization: "US citizen"
  requires_sponsorship: false
  notice_period: "2 weeks"
  desired_salary: "110000"
  years_experience: 4
  willing_to_relocate: false

rules:
  - match: "sponsor"
    answer: "No"
  - match: "salary|compensation|expected pay"
    answer_from: facts.desired_salary
