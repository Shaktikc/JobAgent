# Search criteria (SPEC.md §7).
#
# Filtering is KEYWORD-BASED ONLY: only exclude_keywords / exclude_companies drop
# postings. There are no built-in heuristics and "Promoted" listings are NOT
# excluded by default.

keywords: ["data analyst", "business analyst"]
location: "United States"
remote: true
easy_apply_only: true
posted_within_days: 3
experience_levels: ["mid_senior", "associate"]
exclude_keywords: ["unpaid", "commission only", "staffing agency"]
exclude_companies: []
max_results_per_run: 40
