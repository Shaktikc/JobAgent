# Resume routing — OPTIONAL OVERRIDES ONLY (SPEC.md §7).
#
# Every PDF in `resumes/` is auto-indexed: parsed, then role keywords are
# LLM-extracted once per file hash and cached in SQLite. You may drop ANY number of
# resumes with ANY filenames; there is no fixed taxonomy and no naming convention.
#
# Use this file only to correct the auto-index or pin a forced mapping.

# Replace auto-extracted keywords for a specific file:
overrides: []
#  - file: resumes/data-analyst.pdf
#    role_keywords: ["data analyst", "business analyst", "bi analyst"]

# Used when no resume matches with enough confidence. It is flagged at review.
default_variant:

# Set true to force a full re-index on the next run.
reindex: false
