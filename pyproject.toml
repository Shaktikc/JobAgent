[project]
name = "autojobapply"
version = "0.8.1"
description = "A LangGraph agent that logs in to LinkedIn, searches jobs, selects the Easy Apply filter, opens a job's Easy Apply form, picks the best-matching resume, fills the form through a real browser, and asks the human about unknown questions it then remembers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "AutoJobApply" }]

dependencies = [
    "langgraph>=1.0,<2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
]

[project.scripts]
autojob = "src.main:main"

[project.optional-dependencies]
# The browser layer is heavy (browser-use + a Chromium build). Install on demand:
#   uv sync --extra browser && uvx playwright install chromium
browser = ["browser-use>=0.13,<1.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
