[project]
name = "autojobapply"
version = "0.1.0"
description = "LangGraph agent that searches LinkedIn Easy Apply jobs, fills applications from your resumes, and pauses for human review before submitting."
readme = "SPEC.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "AutoJobApply" }]
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "rich>=13.7",
    "browser-use (>=0.13.10,<0.14.0)",
]

# The package directory is literally named `src` (owner-chosen layout).
[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
ruff = ">=0.6"
mypy = ">=1.11"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---- Tooling -------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: browser smoke tests; require a logged-in LinkedIn session and a real browser. Never run in CI.",
]
